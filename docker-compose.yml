services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_lab_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_lab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_lab"]
      interval: 5s
      timeout: 5s
      retries: 5

  mcp-education:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp_education_server
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    command: ["python3", "01_python_frameworks/mcp_educational_platform_demo.py", "--serve"]
    depends_on:
      db:
        condition: service_healthy

  mcp-wallet:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp_wallet_server
    ports:
      - "8001:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    command: ["python3", "01_python_frameworks/mcp_virtual_wallet_demo.py", "--serve"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
